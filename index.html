<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHT Pro Manager</title>
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #13131a;
            --border-color: #272733;
            --text-main: #e0e0e0;
            --text-muted: #8a8a9b;

            /* Colores de marca */
            --brand-primary: #8b5cf6;

            /* Estados */
            --state-positive: #a78bfa;
            --state-negative: #ff0000;
            --state-active: #34d399;
            --timer-current: #22d3ee;

            --btn-gradient: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* Header */
        h1 {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Configuración */
        .settings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="number"] {
            background: #1e1e26;
            border: 1px solid var(--border-color);
            color: var(--brand-primary);
            padding: 6px 10px;
            border-radius: 8px;
            width: 50px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        /* Área de temporizadores */
        .timers-area {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        #timer-display {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s, transform 0.1s;
        }

        .positive {
            color: var(--state-positive);
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
        }

        .negative {
            color: var(--state-negative);
            text-shadow: 0 0 30px rgba(248, 113, 113, 0.3);
        }

        .current-case-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }

        .cc-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        #current-case-display {
            font-size: 2rem;
            font-weight: 600;
            color: var(--timer-current);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
        }

        @keyframes timerFlash {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.02);
                filter: brightness(1.3);
            }

            100% {
                transform: scale(1);
                filter: brightness(1);
            }
        }

        .flash-anim {
            animation: timerFlash 0.3s ease-out;
        }

        /* Estadísticas */
        .live-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
            background: #1a1a24;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .unit {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 2px;
        }

        /* Controles */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            padding: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, filter 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-add {
            background: var(--btn-gradient);
            color: white;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            z-index: 1;
        }

        .btn-add:hover {
            filter: brightness(1.1);
        }

        .btn-add::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }

            100% {
                transform: scale(50, 50);
                opacity: 0;
            }
        }

        .btn-add.animate::after {
            animation: ripple 0.5s ease-out;
        }

        .btn-pause {
            background: #272733;
            color: #fff;
            border: 1px solid transparent;
        }

        .btn-pause:hover {
            background: #323242;
        }

        .btn-pause.active {
            border: 1px solid #f59e0b;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .btn-edit {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 0.9rem;
        }

        .btn-edit:hover {
            background: #1a1a24;
            color: #fff;
        }

        /* Ventana de restauración */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            max-height: calc(100% - 32px);
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .modal h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .modal input {
            width: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-save {
            flex: 1;
            background: var(--state-active);
            color: #000;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-cancel {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 10px;
        }

        .break-reminder {
            display: none;
            position: fixed;
            inset: 0;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(7px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .break-reminder.visible { display: flex; }

        .break-dialog {
            width: min(420px, 100%);
            box-sizing: border-box;
            padding: 28px;
            border: 1px solid var(--brand-primary);
            border-radius: 22px;
            background: var(--card-bg);
            color: #fff;
            box-shadow: 0 24px 70px rgba(0,0,0,0.65), 0 0 35px rgba(139,92,246,0.18);
            text-align: center;
            animation: reminderIn 0.22s ease-out;
        }

        @keyframes reminderIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .break-dialog-icon { font-size: 2.4rem; margin-bottom: 10px; }
        .break-dialog h2 { margin: 0 0 10px; font-size: 1.35rem; }
        .break-dialog p { margin: 0; color: var(--text-muted); line-height: 1.5; }
        .break-dialog .break-action {
            width: 100%;
            margin-top: 22px;
            background: var(--btn-gradient);
            color: #fff;
        }

        .break-settings-title {
            margin: 8px 0 0;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            color: #fff;
            font-size: 0.95rem;
        }

        .modal-note {
            margin: -8px 0 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .modal input[type="time"] {
            color-scheme: dark;
            background: #1e1e26;
            border: 1px solid var(--border-color);
            color: var(--brand-primary);
            padding: 6px;
            border-radius: 8px;
            width: 105px;
            font: inherit;
        }

        .modal select {
            color-scheme: dark;
            background: #1e1e26;
            border: 1px solid var(--border-color);
            color: var(--brand-primary);
            padding: 8px;
            border-radius: 8px;
            width: 170px;
            font: inherit;
        }

        .btn-preview {
            padding: 8px 12px;
            background: #272733;
            color: #fff;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        /* Información inferior */
        .footer-info {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        #status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            margin-right: 5px;
        }

        .status-on {
            background-color: var(--state-active) !important;
            box-shadow: 0 0 10px var(--state-active);
        }
    </style>
</head>

<body>
    <div class="break-reminder" id="break-reminder" role="alertdialog" aria-modal="true" aria-labelledby="break-reminder-title" aria-describedby="break-reminder-message">
        <div class="break-dialog">
            <div class="break-dialog-icon" aria-hidden="true">☕</div>
            <h2 id="break-reminder-title">Break coming up</h2>
            <p id="break-reminder-message"></p>
            <button class="break-action" id="break-reminder-close" type="button">Got it</button>
        </div>
    </div>
    <div class="container">
        <h1>AHT Control Center</h1>

        <div class="settings">
            <label>Goal AHT:</label>
            <input type="number" id="aht-input" value="60">
            <span>sec</span>
        </div>

        <div class="timers-area">
            <div id="timer-display" class="positive">00:00</div>

            <div class="current-case-wrapper">
                <div class="cc-label">Current Case Duration</div>
                <div id="current-case-display">00:00</div>
            </div>
        </div>

        <div class="live-stats">
            <div class="stat-box">
                <span class="stat-label">Actual AHT</span>
                <span class="stat-value" id="actual-aht">--<span class="unit">s</span></span>
            </div>

            <div class="stat-box">
                <span class="stat-label">Time (COL)</span>
                <span class="stat-value" id="col-time">--:--:--</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn-add" id="btn-add" onclick="addCase()">+ NEW CASE</button>
            <button class="btn-pause" id="btn-pause" onclick="togglePause()">Start / Resume</button>
            <button class="btn-edit" onclick="openModal()">⚙️ Edit / Restore Session</button>
        </div>

        <div class="footer-info">
            <div>Cases: <strong id="case-count" style="color:white">0</strong></div>

            <div style="display:flex; align-items:center;">
                <span id="status-indicator"></span>
                <span id="status-text">Ready</span>
            </div>
        </div>

        <div class="modal-overlay" id="edit-modal">
            <div class="modal">
                <h2>Session &amp; Break Reminders</h2>

                <div class="input-group">
                    <label>Total Cases Done:</label>
                    <input type="number" id="edit-cases" min="0">
                </div>

                <div class="input-group">
                    <label>Total Minutes Worked:</label>
                    <input type="number" id="edit-time" min="0">
                </div>

                <h3 class="break-settings-title">Break schedule</h3>
                <div class="input-group">
                    <label>15-minute break:</label>
                    <input type="time" id="break-time-1">
                </div>
                <div class="input-group">
                    <label>45-minute lunch:</label>
                    <input type="time" id="break-time-2">
                </div>
                <div class="input-group">
                    <label>15-minute break:</label>
                    <input type="time" id="break-time-3">
                </div>
                <p class="modal-note">A pop-up will appear in this page one minute before each scheduled break.</p>

                <h3 class="break-settings-title">Alarm sound</h3>
                <div class="input-group">
                    <label for="alarm-sound">Choose a sound:</label>
                    <select id="alarm-sound">
                        <option value="Alarm 1.mp3">Alarm 1</option>
                        <option value="Alarm 2.mp3">Alarm 2</option>
                        <option value="nuclear-greece.mp3">Nuclear Greece</option>
                        <option value="nuclear-guyana.mp3">Nuclear Guyana</option>
                        <option value="roaster.mp3">Roaster</option>
                    </select>
                </div>
                <div class="input-group">
                    <span></span>
                    <button class="btn-preview" id="preview-alarm" type="button">▶ Preview</button>
                </div>

                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-save" onclick="saveSession()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let balanceSeconds = 0;
        let totalSecondsWorked = 0;
        let currentCaseSeconds = 0;

        let isRunning = false;
        let interval = null;
        let cases = 0;

        // Guarda el momento exacto de la última actualización.
        let lastTickTime = null;

        // Elementos del documento.
        const display = document.getElementById('timer-display');
        const currentCaseDisplay = document.getElementById('current-case-display');
        const statusText = document.getElementById('status-text');
        const statusInd = document.getElementById('status-indicator');
        const pauseBtn = document.getElementById('btn-pause');
        const addBtn = document.getElementById('btn-add');
        const caseCountDisplay = document.getElementById('case-count');
        const ahtInput = document.getElementById('aht-input');
        const actualAhtDisplay = document.getElementById('actual-aht');

        // Elementos de la ventana de restauración.
        const modal = document.getElementById('edit-modal');
        const editCasesInput = document.getElementById('edit-cases');
        const editTimeInput = document.getElementById('edit-time');
        const breakTimeInputs = [1, 2, 3].map(i => document.getElementById(`break-time-${i}`));
        const alarmSoundSelect = document.getElementById('alarm-sound');
        const previewAlarmButton = document.getElementById('preview-alarm');
        const breakReminder = document.getElementById('break-reminder');
        const breakReminderMessage = document.getElementById('break-reminder-message');
        const breakReminderClose = document.getElementById('break-reminder-close');
        const BREAK_STORAGE_KEY = 'aht-break-schedule';
        const ALARM_SOUND_STORAGE_KEY = 'aht-alarm-sound';
        const alarmAudio = new Audio();
        const alertedBreaks = new Set();

        function loadAlarmSound() {
            const savedSound = localStorage.getItem(ALARM_SOUND_STORAGE_KEY);
            if ([...alarmSoundSelect.options].some(option => option.value === savedSound)) {
                alarmSoundSelect.value = savedSound;
            }
        }

        function playAlarmSound() {
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
            alarmAudio.src = alarmSoundSelect.value;
            alarmAudio.loop = false;
            alarmAudio.play().catch(error => console.warn('Could not play alarm sound:', error));
        }

        previewAlarmButton.addEventListener('click', playAlarmSound);

        function loadBreakSchedule() {
            try {
                const saved = JSON.parse(localStorage.getItem(BREAK_STORAGE_KEY) || '[]');
                breakTimeInputs.forEach((input, index) => input.value = saved[index] || '');
            } catch (error) {
                breakTimeInputs.forEach(input => input.value = '');
            }
        }

        function showBreakReminder(message) {
            breakReminderMessage.textContent = message;
            breakReminder.classList.add('visible');
            playAlarmSound();
            alarmAudio.loop = true;
            breakReminderClose.focus();
        }

        function dismissBreakReminder() {
            breakReminder.classList.remove('visible');
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
        }

        breakReminderClose.addEventListener('click', dismissBreakReminder);

        function checkBreakReminders() {
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
            }).formatToParts(now);
            const getPart = type => parts.find(part => part.type === type).value;
            const today = `${getPart('year')}-${getPart('month')}-${getPart('day')}`;
            const currentMinute = `${getPart('hour')}:${getPart('minute')}`;

            breakTimeInputs.forEach((input, index) => {
                if (!input.value) return;
                const [hour, minute] = input.value.split(':').map(Number);
                const start = new Date(Date.UTC(2000, 0, 1, hour, minute));
                start.setUTCSeconds(start.getUTCSeconds() - 30);
                const reminderTime = `${String(start.getUTCHours()).padStart(2, '0')}:${String(start.getUTCMinutes()).padStart(2, '0')}:${String(start.getUTCSeconds()).padStart(2, '0')}`;
                const key = `${today}-${index}-${input.value}`;
                const currentSecond = `${getPart('hour')}:${getPart('minute')}:${getPart('second')}`;
                if (currentSecond === reminderTime && !alertedBreaks.has(key)) {
                    alertedBreaks.add(key);
                    const labels = ['15-minute break', '45-minute lunch', '15-minute break'];
                    showBreakReminder(`Your ${labels[index]} starts in 30 seconds.`);
                }
            });
        }

        window.addEventListener('beforeunload', function (e) {
            if (cases > 0 || isRunning) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // Actualiza el temporizador al volver a la pestaña.
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden && isRunning) {
                tick();
            }
        });

        function tick() {
            if (!isRunning) return;

            const now = Date.now();
            const deltaSeconds = Math.floor((now - lastTickTime) / 1000);

            if (deltaSeconds > 0) {
                balanceSeconds -= deltaSeconds;
                totalSecondsWorked += deltaSeconds;
                currentCaseSeconds += deltaSeconds;

                lastTickTime += deltaSeconds * 1000;

                updateDisplay();
                updateCurrentCaseDisplay();
                updateStats();
            }
        }

        function formatTime(totalSeconds) {
            const absSeconds = Math.abs(totalSeconds);
            const minutes = Math.floor(absSeconds / 60);
            const seconds = absSeconds % 60;

            return (minutes < 10 ? "0" : "") + minutes + ":" +
                   (seconds < 10 ? "0" : "") + seconds;
        }

        function updateDisplay() {
            const isNegative = balanceSeconds < 0;
            const formatted = (isNegative ? "-" : "") + formatTime(balanceSeconds);

            display.textContent = formatted;

            if (balanceSeconds >= 0) {
                display.classList.remove('negative');
                display.classList.add('positive');
            } else {
                display.classList.remove('positive');
                display.classList.add('negative');
            }
        }

        function updateCurrentCaseDisplay() {
            currentCaseDisplay.textContent = formatTime(currentCaseSeconds);
        }

        // Calcula únicamente el AHT real. Throughput fue eliminado.
        function updateStats() {
            if (cases > 0) {
                const realAHT = (totalSecondsWorked / cases).toFixed(0);
                actualAhtDisplay.innerHTML =
                    `${realAHT}<span class="unit">s</span>`;
            } else {
                actualAhtDisplay.innerHTML =
                    `--<span class="unit">s</span>`;
            }
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                lastTickTime = Date.now();
                interval = setInterval(tick, 200);

                statusText.textContent = "Production";
                statusText.style.color = "#34d399";
                statusInd.classList.add('status-on');

                pauseBtn.textContent = "Pause";
                pauseBtn.classList.add('active');
            }
        }

        function togglePause() {
            if (isRunning) {
                tick();
                clearInterval(interval);
                isRunning = false;

                statusText.textContent = "Break / Aux";
                statusText.style.color = "#8a8a9b";
                statusInd.classList.remove('status-on');

                pauseBtn.textContent = "Resume";
                pauseBtn.classList.remove('active');
            } else {
                startTimer();
            }
        }

        function addCase() {
            addBtn.classList.remove('animate');
            void addBtn.offsetWidth;
            addBtn.classList.add('animate');

            display.classList.remove('flash-anim');
            void display.offsetWidth;
            display.classList.add('flash-anim');

            const timeToAdd = parseInt(ahtInput.value) || 60;

            balanceSeconds += timeToAdd;
            cases++;

            currentCaseSeconds = 0;
            updateCurrentCaseDisplay();

            caseCountDisplay.textContent = cases;

            updateStats();
            startTimer();
            updateDisplay();
        }

        /* Lógica de restauración de sesión */
        function openModal() {
            if (isRunning) togglePause();

            editCasesInput.value = cases;
            editTimeInput.value = Math.floor(totalSecondsWorked / 60);
            loadBreakSchedule();

            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
        }

        function saveSession() {
            const newCases = parseInt(editCasesInput.value) || 0;
            const newMinutes = parseInt(editTimeInput.value) || 0;
            const goal = parseInt(ahtInput.value) || 60;

            cases = newCases;
            totalSecondsWorked = newMinutes * 60;
            const schedule = breakTimeInputs.map(input => input.value);
            localStorage.setItem(BREAK_STORAGE_KEY, JSON.stringify(schedule));
            localStorage.setItem(ALARM_SOUND_STORAGE_KEY, alarmSoundSelect.value);
            alertedBreaks.clear();

            balanceSeconds = (cases * goal) - totalSecondsWorked;
            currentCaseSeconds = 0;

            caseCountDisplay.textContent = cases;

            updateDisplay();
            updateCurrentCaseDisplay();
            updateStats();

            closeModal();
        }

        // Reloj en vivo de Colombia.
        function updateColombiaTime() {
            const timeOptions = {
                timeZone: 'America/Bogota',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };

            const timeParts = new Intl.DateTimeFormat(
                'en-US',
                timeOptions
            ).formatToParts(new Date());

            const hours = timeParts.find(
                part => part.type === 'hour'
            ).value;

            const minutes = timeParts.find(
                part => part.type === 'minute'
            ).value;

            const seconds = timeParts.find(
                part => part.type === 'second'
            ).value;

            const ampm = timeParts.find(
                part => part.type === 'dayPeriod'
            ).value;

            document.getElementById('col-time').innerHTML =
                `${hours}:${minutes}:${seconds}<span class="unit">${ampm}</span>`;
        }

        // Mostrar la hora inmediatamente y actualizarla cada segundo.
        updateColombiaTime();
        setInterval(updateColombiaTime, 1000);
        loadBreakSchedule();
        loadAlarmSound();
        checkBreakReminders();
        setInterval(checkBreakReminders, 10000);

        // Inicialización de los temporizadores.
        updateDisplay();
        updateCurrentCaseDisplay();
    </script>
</body>
</html>
